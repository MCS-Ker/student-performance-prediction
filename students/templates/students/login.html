<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نظام التنبؤ بأداء الطلاب</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <    <style>
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            margin: 0;
            /* تدرج لوني قطري بألوان الموقع */
            background: linear-gradient(135deg, #12262f 0%, #1b3a4b 45%, #2c6e8f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* عنصران دائريان شفافان يضيفان عمقا للخلفية */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
        }

        .blob-one {
            width: 520px;
            height: 520px;
            background: rgba(76, 175, 208, 0.28);
            top: -140px;
            left: -120px;
        }

        .blob-two {
            width: 440px;
            height: 440px;
            background: rgba(44, 110, 143, 0.35);
            bottom: -160px;
            right: -100px;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 720px;
            padding: 1rem;
        }

        .brand-welcome {
            color: rgba(255, 255, 255, 0.55);
            font-size: 1.15rem;
            letter-spacing: 8px;
            direction: ltr;
            text-align: center;
            margin-bottom: 0.6rem;
        }

        .brand-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 3.4rem;
            line-height: 1.15;
            letter-spacing: 1px;
            direction: ltr;
            text-align: center;
            margin-bottom: 0;
        }

        .brand-subtitle {
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            font-size: 1.5rem;
            margin-top: 1.4rem;
            margin-bottom: 3rem;
        }

        /* البطاقة شبه شفافة ليظهر التدرج خلفها */
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            padding: 2.2rem 4.5rem;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }

        .form-control {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 1.05rem;
        }

        .form-label {
            font-size: 1.02rem;
            margin-bottom: 0.4rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #1b3a4b 0%, #2c6e8f 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
        }

        .btn-login:hover {
            color: #ffffff;
            opacity: 0.92;
        }

        .note {
            color: #7a8a94;
            font-size: 0.88rem;
            text-align: center;
            margin-top: 1.8rem;
            margin-bottom: 0;
        }

        /* تصغير الأحجام على الشاشات الصغيرة */
        @media (max-width: 768px) {
            .brand-title { font-size: 2.1rem; }
            .brand-subtitle { font-size: 1.15rem; }
            .brand-welcome { font-size: 0.95rem; letter-spacing: 5px; }
            .login-card { padding: 2rem 1.5rem; }
        }
    </style>

</head>

<body>

<div class="blob blob-one"></div>
<div class="blob blob-two"></div>

<div class="login-wrapper">

    <p class="brand-welcome">WELCOME TO</p>
    <h1 class="brand-title">STUDENT PERFORMANCE<br>PREDICTION SYSTEM</h1>
    <p class="brand-subtitle">الكشف المبكر عن الطلاب المتعثرين وتحليل أدائهم</p>

    <div class="login-card">

        {% if form.errors %}
        <div class="alert alert-danger">
            اسم المستخدم أو كلمة المرور غير صحيحة.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-login">دخول</button>
        </form>

        <p class="note">
            الحسابات تُنشأ من قبل إدارة المدرسة.<br>
            للحصول على حساب، يُرجى مراجعة الإدارة.
        </p>

    </div>

</div>

</body>
</html>
